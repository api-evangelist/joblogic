  - url: https://www.linkedin.com/company/job-logic
    type: LinkedIn
    note: Company profile - UK field service management software, founded 1998.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Joblogic's own public API is
    request/response REST (/api/v1) with OAuth2 client-credentials auth, plus
    outbound webhook HTTP callbacks for change events. No AsyncAPI document was
    created because there is no server-push socket transport on Joblogic's own
    API to model; webhooks are one-way HTTP POST delivery documented as payload
    schemas, not a bidirectional WebSocket.
