  endpointsModeled:
    note: |
      Request/response bodies in the OpenAPI and collections are modeled by API
      Evangelist. Paths and methods are grounded in the live Postman
      collection, but payload schemas (field names/types) are representative
      because the IP-allowlisted API could not be called directly. The webhook
      Job payload shape is grounded in an example from Joblogic's documentation.
sources:
  - url: https://apidocs.joblogic.com/
    type: Documentation
    note: Official Joblogic Developer Platform (Postman-hosted). Confirms REST /api/v1 paths, OAuth2 client-credentials auth, tenantId, 100 req/min rate limit, 429, and the webhook event catalog.
  - url: https://support.joblogic.com/docs/api-access
    type: Documentation
    note: API access process - IP allowlisting, UAT provisioning, Client ID / Secret / Tenant ID, one-hour token expiry.
  - url: https://www.joblogic.com/marketplace/api-access
    type: Documentation
    note: Self-service API Access app for requesting credentials.
  - url: https://www.joblogic.com/pricing/
    type: Pricing
