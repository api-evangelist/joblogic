aid: joblogic
name: Joblogic
review:
  question: Does Joblogic expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Joblogic's documented public interface
    is a request/response REST API (all paths under /api/v1) plus outbound
    webhooks. Webhooks are server-to-client HTTP POST callbacks - Joblogic
    POSTs a JSON payload to a URL the customer configures when a subscribed
    event (job/visit/invoice/quote/site/asset created, updated, deleted, or
    status-changed, and many more) fires. That is one-way HTTP delivery, not a
    persistent bidirectional WebSocket (ws:// or wss://) transport on
    Joblogic's own API, so there is no server-push socket surface to model in
    AsyncAPI. The webhook catalog is documented as payload schemas, not as
    programmatic subscription endpoints in the public collection.
findings:
  summary: |
    Joblogic does not publish a documented public WebSocket API. Joblogic is a
    cloud field service management (FSM) platform. Its public API is a REST API
    with all resource paths under /api/v1 (Customer, Contact, Site, Asset, Job,
    JobCost, Visit, Engineer, Quote, Invoice, and many supporting resources),
    documented via a Postman collection at https://apidocs.joblogic.com/.
    Authentication is OAuth2 client-credentials against a Joblogic
    IdentityServer (POST client_id, client_secret, grant_type=client_credentials,
    scope to /connect/token), returning a Bearer access token that expires after
    one hour. Most calls require a tenantId (GUID) query parameter. Change
    notifications are delivered by outbound webhooks (HTTP POST callbacks), not
    by a WebSocket. No realtime, bidirectional, or streaming WebSocket (ws:// or
    wss://) endpoint is documented anywhere in Joblogic's API.
  accessModel: |
    API access is customer-provisioned and gated. Joblogic issues a Client ID,
    Client Secret, and Tenant ID and IP-allowlists the caller's public IP
    addresses behind its firewall before requests are accepted. Integrations
    are developed against a per-customer UAT sandbox (web app
    https://uat.joblogic.com, API host https://uatapi.joblogic.com, token host
    https://uatidentityserver.joblogic.com) and then promoted to production. A
    self-service "API Access" app can issue credentials, and Joblogic also
    offers paid integration development services. Because the resource servers
    are IP-allowlisted, live request/response bodies could not be exercised
    directly for this review.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.joblogic.com/api/v1
      documented: true
      note: All resource paths under /api/v1. Production host is firewall/IP-allowlisted; UAT host is https://uatapi.joblogic.com/api/v1.
    - protocol: OAuth2 Token
      scheme: https
      documented: true
      note: IdentityServer client-credentials token endpoint. Confirmed UAT endpoint https://uatidentityserver.joblogic.com/connect/token; production endpoint provisioned during onboarding.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Outbound HTTP POST callbacks for subscribed events (job, visit, invoice, quote, site, asset, and many more). Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Joblogic's API or webhook reference as of the review date.
  endpointsConfirmed:
