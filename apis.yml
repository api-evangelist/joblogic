aid: joblogic
url: https://raw.githubusercontent.com/api-evangelist/joblogic/refs/heads/main/apis.yml
name: Joblogic
kind: company
description: Joblogic is a cloud field service management (FSM) platform for
  trades, service, and maintenance contractors - covering customers, sites,
  assets, jobs, engineer scheduling, mobile workforce, quotes, invoices, stock,
  and PPM (planned preventative maintenance) contracts. Joblogic exposes a
  REST API (base path /api/v1) secured with OAuth2 client-credentials tokens
  issued by a Joblogic IdentityServer, plus outbound webhooks for change
  events. API access is customer-provisioned - Joblogic issues a Client ID,
  Client Secret, and Tenant ID and IP-allowlists callers behind a firewall,
  with a UAT sandbox for integration development.
