principles:
- name: Visibility
  description: Track licensed user counts by tier and department; reconcile active users against invoiced seats each term.
- name: Allocation
  description: Map user licenses to teams / cost centers; attribute implementation and integration fees to the sponsoring project.
- name: Optimization
  description: Right-size the number of seats and the feature tier to actual usage; deactivate unused users; consolidate integrations to avoid repeated bespoke development fees.
- name: Accountability
  description: Assign an owner for the Joblogic subscription; review seat counts and tier fit against the annual renewal.
