description: >-
  FinOps view of Joblogic spend. Joblogic is a per-user, per-month SaaS
  subscription for field service management, typically billed annually and
  tiered by feature set. The dominant cost driver is the number of licensed
  users (back-office and mobile engineers) multiplied by the tier rate, plus
  one-off implementation / onboarding and optional custom integration
  development fees (Joblogic takes a 50% deposit before custom integration work
  starts). The REST API and webhooks are not separately metered with public
  per-call pricing - API access is provisioned to existing subscribers rather
  than billed by usage - so cost management centers on right-sizing user
  licenses and tier selection rather than on API call volume.
notes: >-
  Per-user tier rates are quote-based and not publicly reconciled; verify with
  Joblogic sales. Because billing is per user rather than per API call, the
  100-requests-per-minute API rate limit is an operational constraint, not a
  billing meter.
